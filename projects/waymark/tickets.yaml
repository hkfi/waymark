  - id: delete-memory-context-records
    title: Delete Memory and Context records
    status: done
    priority: medium
    summary: Extend explicit destructive actions beyond tickets so users can remove Context references, thread references, ideas, and decisions without deleting external project assets by implication.
    acceptance_criteria:
      - Context registry rows delete records from links.yaml with danger styling and clear confirmation copy.
      - Repo Context rows can remove the project.yaml repo reference without deleting the repository folder.
      - Ticket file Context rows can unlink a file path from tickets.yaml without deleting the file.
      - Thread references can be deleted from threads.yaml while preserving summary files and unlinking ticket references.
      - Idea and decision notes can be deleted from their Markdown files, with decisions also unlinked from tickets.
      - Ticket inspectors expose generated prompt references and can remove a prompt reference without deleting the prompt file.
      - Workspace file contract documents deletion behavior for project-memory records and references.
