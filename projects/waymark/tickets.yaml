  - id: simplify-contextual-codex-ux
    title: Simplify contextual Codex UX
    status: done
    priority: high
    summary: Make contextual Codex actions clearer, more visually distinct, and less overwhelming by using explicit action labels, AI-specific styling, session-scoped consent, and a simplified Assistant default view.
    acceptance_criteria:
      - Contextual Codex buttons use explicit outcome labels instead of vague Ask copy.
      - Codex recommendation actions use a cyan-blue AI treatment distinct from amber handoff actions.
      - Contextual recommendation buttons prepare Assistant prompts but never invoke Codex directly.
      - Empty ticket and early setup states can prepare a next-step Assistant prompt without running Codex automatically.
      - The Assistant default view hides advanced route, model, reasoning, connection, and import controls.
      - Browser/demo and disconnected Codex states explain why recommendations cannot run.
      - Token-consuming Codex run controls are visually distinct from AI setup, navigation, and prompt-fill controls.
      - Structured draft schema accepts ticket updates without failing Codex strict schema validation.
      - Long Codex errors are summarized so the Assistant panel remains responsive.
      - Advanced action modes are compact at inspector width and expose immediate hover guidance.
      - Right inspector modes avoid nested vertical scroll containers unless the mode explicitly splits fixed-height sections.
    linked_files:
      - docs/ai-workflows.md
      - src/assistant.ts
      - src/components/assistant.tsx
      - src/components/inspector.tsx
      - src/components/primitives.tsx
      - src/components/shell.tsx
      - src/styles.css
