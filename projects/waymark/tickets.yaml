  - id: codex-backed-assistant
    title: Codex-backed Waymark Assistant
    status: now
    priority: high
    summary: Add an optional assistant that uses the user's local Codex auth for brainstorming and review-gated project-memory drafts.
    acceptance_criteria:
      - Waymark can detect a local Codex binary without reading or storing Codex tokens.
      - The Assistant drawer shows connected state, OpenAI account switching through Codex, route, model, reasoning, project context notice, and disabled copy in browser/demo mode.
      - Codex and ChatGPT are not presented as separate account choices because Waymark uses the local Codex runtime as the shared OpenAI connection.
      - The default assistant settings are Latest model and High reasoning, with explicit controls to pin another supported model or effort.
      - App-server mode starts an ephemeral read-only Codex thread and streams assistant deltas into the conversation.
      - CLI execution remains available as a fallback when app-server start or turn execution fails.
      - Brainstorm, structure, and pasted-output capture flow into the same draft review model.
      - Draft tickets, ideas, decisions, and thread references are editable and selected before any Markdown/YAML write.
      - Invalid linked ticket, decision, and thread IDs are shown as warnings instead of being silently written.
      - Manual capture remains usable without Codex and hides raw ID fields behind Advanced controls.
      - Documentation records the promoted MVP scope and the Codex subscription-auth decision.
    linked_files:
      - src/components/assistant.tsx
      - src/assistant.ts
      - src-tauri/src/lib.rs
      - docs/ai-workflows.md
      - docs/mvp-boundaries.md
    linked_decisions:
      - codex-subscription-connector
    linked_threads:
      - assistant-verification-2026-05-05
    generated_prompts: []
  - id: guided-repo-onboarding
    title: Guided repo onboarding
    status: next
    priority: high
    summary: Let users explicitly add local repos to a Waymark project, scaffold missing project memory, and optionally ask Codex to draft review-gated repo context files.
    acceptance_criteria:
      - A user can add one or more local repo folders to a Waymark project through an explicit action.
      - Added repos are saved as readable project.yaml repo references and remain editable by hand.
      - The onboarding flow detects missing Waymark memory files and presents deterministic scaffolds before writing them.
      - Codex can optionally draft a project summary, initial tickets, decisions, handoff context, and repo agent instructions.
      - Generated drafts distinguish Waymark workspace files from files that would be written into a linked repo.
      - No generated file or project-memory record is written until the user previews and accepts it.
      - The flow does not perform background repo indexing, whole-repo prompt stuffing, hosted service import, or direct Codex file mutation.
      - Documentation records this as promoted MVP scope with local-first and review-gated constraints.
    linked_files:
      - docs/roadmap.md
      - docs/mvp-boundaries.md
      - docs/ai-workflows.md
      - src/workspace.ts
      - src/app/hooks/useProjectActions.ts
      - src/components/modals.tsx
      - src/components/assistant.tsx
    linked_decisions:
      - guided-repo-onboarding
    linked_threads:
      - guided-repo-onboarding-2026-05-05
    generated_prompts: []
  - id: signed-github-release-updater
    title: Signed GitHub Release updater
    status: done
    priority: high
    summary: Publish signed Tauri releases from intentional version bumps and show an in-app update indicator when a newer GitHub Release is available.
    acceptance_criteria:
      - Release policy documents that main is releasable but only version bumps publish app updates.
      - Agents know to update package.json, src-tauri/Cargo.toml, and src-tauri/tauri.conf.json together when shipping an update.
      - Tauri updater artifacts and GitHub latest.json are configured for GitHub Releases.
      - The app checks for signed updates and shows a toolbar update indicator only when a newer release exists.
      - Installing an update requires an explicit user click.
    linked_files:
      - docs/release-policy.md
      - .github/workflows/release.yml
      - src/app/hooks/useAppUpdates.ts
      - src/components/shell.tsx
