    title: Simplify cockpit IA
    status: done
    priority: high
    summary: Collapse the cockpit to Overview, Tickets, Memory, and Context; move Assistant into the right drawer; and make typed Context records the durable home for files and service links.
    acceptance_criteria:
      - Sidebar navigation has Overview, Tickets, Memory, and Context only.
