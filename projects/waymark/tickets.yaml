  - id: codex-backed-assistant
    title: Codex-backed Waymark Assistant
    status: now
    priority: high
    summary: Add an optional assistant that uses the user's local Codex auth for brainstorming and review-gated project-memory drafts.
    acceptance_criteria:
      - Waymark can detect a local Codex binary without reading or storing Codex tokens.
      - The Assistant drawer shows connected state, OpenAI account switching through Codex, route, model, reasoning, project context notice, and disabled copy in browser/demo mode.
      - Codex and ChatGPT are not presented as separate account choices because Waymark uses the local Codex runtime as the shared OpenAI connection.
      - The default assistant settings are Latest model and High reasoning, with explicit controls to pin another supported model or effort.
      - App-server mode starts an ephemeral read-only Codex thread and streams assistant deltas into the conversation.
      - The Assistant conversation, prompt, and draft review stay available while switching inspector tabs within the same project.
      - CLI execution remains available as a fallback when app-server start or turn execution fails.
      - Brainstorm, structure, and pasted-output capture flow into the same draft review model.
      - Draft tickets, ideas, decisions, and thread references are editable and selected before any Markdown/YAML write.
      - Invalid linked ticket, decision, and thread IDs are shown as warnings instead of being silently written.
      - Manual capture remains usable without Codex and hides raw ID fields behind Advanced controls.
      - Documentation records the promoted MVP scope and the Codex subscription-auth decision.
    linked_files:
      - src/components/assistant.tsx
      - src/assistant.ts
      - src-tauri/src/lib.rs
      - docs/ai-workflows.md
      - docs/mvp-boundaries.md
    linked_decisions:
      - codex-subscription-connector
    linked_threads:
      - assistant-verification-2026-05-05
    generated_prompts: []
  - id: contextual-codex-recommendations
    title: Contextual Codex recommendations
    status: done
    priority: high
    summary: Let meaningful project-memory fields ask Codex for reviewable recommendations that turn brainstorming into tickets, decisions, summaries, and next-step options.
    acceptance_criteria:
      - Prose-heavy project-memory fields can offer a contextual Codex recommendation action without making mechanical fields noisy.
      - Recommendation prompts include the selected project, current field value, and relevant ticket, memory, thread, or handoff context after the user confirms the Codex notice.
      - Codex can propose several scoped options for next steps, missing decisions, ticket drafts, acceptance criteria, or wording improvements.
      - Suggestions enter an editable review flow before insertion or save.
      - Accepted tickets, ideas, decisions, and summaries can link back to a saved Codex thread reference when available.
      - Manual capture remains usable when Codex is unavailable.
      - Documentation records the conversation-to-structured-memory workflow and the quiet-field guardrail for IDs, slugs, paths, URLs, and tags.
    linked_files:
      - docs/ai-workflows.md
      - docs/mvp-boundaries.md
      - docs/roadmap.md
