version: 1
tickets:
  - id: agent-context-foundation
    title: Agent context foundation
    status: done
    priority: high
    summary: Add repo-level AI context, development standards, and a self-referential Waymark project memory folder.
    acceptance_criteria:
      - Agents have a short repo entrypoint.
      - Architecture and development standards are documented.
      - Waymark can open this repo as a Waymark workspace.
      - Local tickets, decisions, and ideas exist as readable files.
    linked_files:
      - AGENTS.md
      - ARCHITECTURE.md
      - docs/development-standards.md
      - docs/ai-workflows.md
    linked_decisions:
      - self-workspace-in-repo
    linked_threads: []
    generated_prompts: []
  - id: refine-workspace-file-contract
    title: Refine workspace file contract
    status: next
    priority: high
    summary: Tighten schemas and UX around project.yaml, tickets.yaml, links.yaml, threads.yaml, ideas, decisions, and generated prompts.
    acceptance_criteria:
      - File contract is documented with examples.
      - Validation errors point to specific files and fields.
      - Existing sample workspace remains readable.
      - Waymark self workspace remains readable.
    linked_files:
      - src/workspace.ts
      - ARCHITECTURE.md
    linked_decisions:
      - markdown-yaml-source-of-truth
    linked_threads: []
    generated_prompts: []
  - id: improve-handoff-context-picker
    title: Improve handoff context picker
    status: next
    priority: medium
    summary: Make the handoff panel better at suggesting linked files, decisions, thread summaries, and project standards.
    acceptance_criteria:
      - Handoff preview can include project standards.
      - User can see why each context item was suggested.
      - Generated prompt remains readable Markdown.
    linked_files:
      - src/App.tsx
      - src/workspace.ts
      - docs/ai-workflows.md
    linked_decisions: []
    linked_threads: []
    generated_prompts: []
  - id: codex-backed-assistant
    title: Codex-backed Waymark Assistant
    status: now
    priority: high
    summary: Add an optional assistant that uses the user's local Codex auth for brainstorming and review-gated project-memory drafts.
    acceptance_criteria:
      - Waymark can detect a local Codex binary without reading or storing Codex tokens.
      - The Assistant panel shows connection state, route, project context notice, and disabled copy in browser/demo mode.
      - App-server mode starts an ephemeral read-only Codex thread and streams assistant deltas into the conversation.
      - CLI execution remains available as a fallback when app-server start or turn execution fails.
      - Brainstorm, structure, and pasted-output capture flow into the same draft review model.
      - Draft tickets, ideas, decisions, and thread references are editable and selected before any Markdown/YAML write.
      - Invalid linked ticket, decision, and thread IDs are shown as warnings instead of being silently written.
      - Manual capture remains usable without Codex and hides raw ID fields behind Advanced controls.
      - Documentation records the promoted MVP scope and the Codex subscription-auth decision.
    linked_files:
      - src/components/assistant.tsx
      - src/assistant.ts
      - src-tauri/src/lib.rs
      - docs/ai-workflows.md
      - docs/mvp-boundaries.md
    linked_decisions:
      - codex-subscription-connector
    linked_threads: []
    generated_prompts: []
  - id: signed-github-release-updater
    title: Signed GitHub Release updater
    status: done
    priority: high
    summary: Publish signed Tauri releases from intentional version bumps and show an in-app update indicator when a newer GitHub Release is available.
    acceptance_criteria:
      - Release policy documents that main is releasable but only version bumps publish app updates.
      - Agents know to update package.json, src-tauri/Cargo.toml, and src-tauri/tauri.conf.json together when shipping an update.
      - Tauri updater artifacts and GitHub latest.json are configured for GitHub Releases.
      - The app checks for signed updates and shows a toolbar update indicator only when a newer release exists.
      - Installing an update requires an explicit user click.
    linked_files:
      - docs/release-policy.md
      - .github/workflows/release.yml
      - src/app/hooks/useAppUpdates.ts
      - src/components/shell.tsx
      - src-tauri/tauri.conf.json
    linked_decisions:
      - github-release-updater
    linked_threads: []
    generated_prompts: []
  - id: first-run-sample-workspace
    title: First-run sample workspace
    status: done
    priority: medium
    summary: Make the downloaded app offer a safe sample workspace path so new users can explore Waymark before creating real project memory.
    acceptance_criteria:
      - First launch defaults to a user-owned sample path instead of a developer machine path.
      - Missing sample workspace on first launch does not show a scary load error.
      - The empty state has a clear create-sample action.
      - Sample creation refuses to overwrite an existing workspace.
      - Documentation mentions the sample workspace path for downloaded apps.
    linked_files:
      - src/app/model.ts
      - src/app/hooks/useWorkspaceState.ts
      - src/workspace.ts
      - src/components/modals.tsx
      - README.md
    linked_decisions: []
    linked_threads: []
    generated_prompts: []
  - id: mvp-scope-governance
    title: MVP scope governance
    status: done
    priority: high
    summary: Define MVP boundaries, exit criteria, and roadmap docs so agents know when to avoid scope creep and when MVP has ended.
    acceptance_criteria:
      - MVP boundaries are documented as temporary scope controls.
      - Exit criteria explain when Waymark is no longer in MVP.
      - Roadmap separates MVP, hardening, post-MVP, V1, and later work.
      - Agent entrypoints point to the scope docs before adding product surface area.
    linked_files:
      - docs/mvp-boundaries.md
      - docs/mvp-exit-criteria.md
      - docs/roadmap.md
      - .agent/rules/mvp-boundaries.md
      - AGENTS.md
    linked_decisions: []
    linked_threads: []
    generated_prompts: []
